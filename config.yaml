# ─────────────────────────────────────────────────────────────────────────────
# daily-brief config — edit freely. Everything here is optional except `sections`.
# ─────────────────────────────────────────────────────────────────────────────

timezone: America/Los_Angeles
lookback_hours: 36          # how far back "recent" means for daily items
weekly_lookback_hours: 192  # for weekly-cadence sources (newsletters, long podcasts)

# What you care about. Matched against title + summary (case-insensitive).
# Weight = how much a match boosts an item. Negative weights demote.
interests:
  # your research (UW Mobile Intelligence Lab)
  hearable: 4
  earable: 4
  earbud: 4
  hearing aid: 4
  target speech: 4
  speech separation: 3
  sound source separation: 3
  spatial audio: 3
  acoustic sensing: 4
  wireless sensing: 4
  backscatter: 4
  battery-free: 4
  wearable: 3
  on-device: 3
  edge ai: 3
  low-power: 2
  mobile health: 3
  # AI / ML
  llm: 2
  language model: 2
  transformer: 2
  agent: 2
  reasoning: 2
  reinforcement learning: 2
  rlhf: 2
  fine-tuning: 2
  lora: 3
  distillation: 2
  quantization: 3
  inference: 2
  scaling law: 3
  diffusion: 1
  multimodal: 2
  interpretability: 2
  alignment: 1
  open-source model: 2
  anthropic: 2
  openai: 1
  ai2: 3
  allen institute: 3
  # SWE / systems
  distributed system: 3
  consensus: 3
  raft: 3
  paxos: 3
  database: 2
  storage: 2
  kubernetes: 1
  system design: 3
  latency: 2
  postgres: 2
  rust: 1
  compiler: 1
  gpu: 2
  cuda: 2
  outage: 2
  postmortem: 3
  incident: 2
  scalability: 2
  recommendation: 2
  ml platform: 3
  feature store: 3
  uber: 3
  # career / Seattle
  new grad: 3
  hiring: 1
  layoff: 1
  seattle: 2
  university of washington: 3
  uw: 1
  microsoft: 1
  amazon: 1
  # demote noise
  crypto: -2
  nft: -3
  sponsored: -3
  deal of the day: -5

# Optional: Claude writes a 1–2 line "why it matters" + an opinion prompt per top item.
# Set ANTHROPIC_API_KEY in your env / GitHub secret to enable. Falls back gracefully.
llm:
  enabled: true
  model: claude-sonnet-5-5
  max_items: 14
  opinion_prompts: 3   # "take a stance" questions at the bottom of the brief

# ── Sections: order = order in the brief. `max` = how many items to show. ──
sections:
  - id: world
    title: "🌍 World — be the person who knows what's going on"
    max: 4
  - id: tech
    title: "📰 Tech & Seattle"
    max: 6
  - id: ai
    title: "🤖 AI / ML — news & analysis"
    max: 6
  - id: papers_hot
    title: "🔥 Papers everyone is talking about (HF Daily Papers)"
    max: 4
  - id: lab
    title: "🎧 Mobile Intelligence Lab radar (hearables · sensing · on-device)"
    max: 5
  - id: swe
    title: "🛠️ SWE & distributed systems"
    max: 6
  - id: listen
    title: "🎙️ Listen (runs + commute)"
    max: 4
  - id: watch
    title: "📺 Watch (instead of Netflix)"
    max: 4
  - id: newsletters
    title: "📬 Sunday newsletter catch-up"
    max: 8
    weekdays: [sun]
  - id: events
    title: "📅 Seattle AI events"
    max: 5
    weekdays: [mon, thu]

# ── Sources ──────────────────────────────────────────────────────────────────
# kind: rss | hn | hf_papers | arxiv | youtube | podcast | luma
# weight: base importance (1.0 = normal). cadence: daily | weekly (sets lookback)
sources:
  # World / general — a few neutral, wire-style feeds
  - {name: AP Top News,      kind: rss, section: world, weight: 1.2, url: "https://feedx.net/rss/ap.xml"}
  - {name: BBC World,        kind: rss, section: world, weight: 1.1, url: "https://feeds.bbci.co.uk/news/world/rss.xml"}
  - {name: NPR News,         kind: rss, section: world, weight: 1.0, url: "https://feeds.npr.org/1001/rss.xml"}
  - {name: Reuters (via Google News), kind: rss, section: world, weight: 1.0, url: "https://news.google.com/rss/search?q=when:1d+source:Reuters&hl=en-US&gl=US&ceid=US:en"}
  - {name: Quanta Magazine,  kind: rss, section: world, weight: 0.9, url: "https://www.quantamagazine.org/feed/", cadence: weekly}

  # Tech & Seattle
  - {name: GeekWire,         kind: rss, section: tech, weight: 1.4, url: "https://www.geekwire.com/feed/"}
  - {name: Hacker News,      kind: hn,  section: tech, weight: 1.0, min_points: 250}
  - {name: Ars Technica,     kind: rss, section: tech, weight: 0.8, url: "https://feeds.arstechnica.com/arstechnica/index"}
  - {name: The Verge,        kind: rss, section: tech, weight: 0.6, url: "https://www.theverge.com/rss/index.xml"}

  # AI / ML news & analysis
  - {name: Import AI (Jack Clark),  kind: rss, section: ai, weight: 1.5, url: "https://importai.substack.com/feed", cadence: weekly, also: newsletters}
  - {name: The Batch (deeplearning.ai), kind: rss, section: ai, weight: 1.3, url: "https://www.deeplearning.ai/the-batch/feed/", cadence: weekly, also: newsletters}
  - {name: Simon Willison,          kind: rss, section: ai, weight: 1.3, url: "https://simonwillison.net/atom/everything/"}
  - {name: Interconnects (Nathan Lambert, AI2), kind: rss, section: ai, weight: 1.3, url: "https://www.interconnects.ai/feed", cadence: weekly}
  - {name: Latent Space,            kind: rss, section: ai, weight: 1.1, url: "https://www.latent.space/feed", cadence: weekly}
  - {name: Karpathy's blog,         kind: rss, section: ai, weight: 2.0, url: "https://karpathy.bearblog.dev/feed/", cadence: weekly}
  - {name: Anthropic news,          kind: rss, section: ai, weight: 1.2, url: "https://news.google.com/rss/search?q=site:anthropic.com&hl=en-US&gl=US&ceid=US:en"}
  - {name: Google Research blog,    kind: rss, section: ai, weight: 1.0, url: "https://research.google/blog/rss/"}
  - {name: AI2 blog,                kind: rss, section: ai, weight: 1.2, url: "https://news.google.com/rss/search?q=site:allenai.org&hl=en-US&gl=US&ceid=US:en", cadence: weekly}

  # Papers
  - {name: HF Daily Papers, kind: hf_papers, section: papers_hot, weight: 1.0, min_upvotes: 15}
  - name: arXiv — your lab's area
    kind: arxiv
    section: lab
    weight: 1.6
    cadence: weekly
    max_results: 60
    # arXiv API query syntax. Categories: audio/speech, signal processing, HCI, networking, mobile/ubiquitous.
    query: >
      (cat:eess.AS OR cat:cs.SD OR cat:eess.SP OR cat:cs.HC OR cat:cs.NI OR cat:cs.ET)
      AND (abs:hearable OR abs:earable OR abs:earbuds OR abs:"hearing aid" OR abs:"target speech"
           OR abs:"acoustic sensing" OR abs:"wireless sensing" OR abs:backscatter OR abs:"battery-free"
           OR abs:"on-device" OR abs:wearable OR abs:"spatial audio" OR abs:"speech separation")
  - {name: arXiv — Gollakota / lab authors, kind: arxiv, section: lab, weight: 2.5, cadence: weekly, max_results: 15,
     query: 'au:Gollakota OR au:"Bandhav Veluri" OR au:"Malek Itani" OR au:"Tuochao Chen"'}
  - name: arXiv — distributed systems
    kind: arxiv
    section: swe
    weight: 0.9
    cadence: weekly
    max_results: 40
    query: >
      (cat:cs.DC OR cat:cs.DB OR cat:cs.OS)
      AND (abs:consensus OR abs:replication OR abs:"distributed database" OR abs:"LLM serving"
           OR abs:"inference serving" OR abs:scheduler OR abs:"fault tolerance")

  # Podcast-only pool (section: pool → never shown in the brief, only feeds NotebookLM episodes)
  - name: arXiv — efficient / on-device / audio ML
    kind: arxiv
    section: pool
    weight: 1.0
    cadence: weekly
    max_results: 50
    query: >
      (cat:cs.LG OR cat:cs.CL OR cat:eess.AS OR cat:cs.SD)
      AND (abs:"on-device" OR abs:quantization OR abs:"speculative decoding" OR abs:"KV cache"
           OR abs:"audio language model" OR abs:"speech language model" OR abs:"small language model")

