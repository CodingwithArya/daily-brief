# ── NotebookLM → podcast episodes ────────────────────────────────────────────
# Every day the planner builds up to `episodes_per_day` episodes:
#   • on classic-paper days: the next classic, bundled with up to 2 fresh items on the same topic ("then & now")
#   • otherwise / after the 14 classics are done: TOPIC episodes — several new papers, blog posts or videos
#     on one topic go into ONE notebook, and NotebookLM makes a single synthesis episode from all of them.
# Candidates come from a rolling 7-day pool (papers from lab/hot/arXiv + strong AI/SWE posts + videos),
# so slow days still get good episodes and nothing is ever podcasted twice.
notebooklm:
  enabled: true
  episodes_per_day: 2
  pool_days: 7
  max_sources_per_episode: 4      # NotebookLM handles many more; 3–4 keeps a 20-min episode focused
  min_sources_per_topic: 2        # fewer → falls back to a single-paper deep dive (if it's strong)
  max_non_papers_per_episode: 2   # blog posts / YouTube videos allowed alongside papers
  topic_cooldown_days: 2          # a topic covered in the last N days only repeats if nothing else qualifies
  format: deep-dive               # deep-dive | brief | critique | debate
  length: default                 # short | default | long  (bundles use `long` automatically if ≥3 sources)
  keep_notebooks: true            # keep them so you can chat with the sources later
  output_dir: podcasts
  public_base_url: ""
  # Topics are how items get grouped. Add/rename freely; `boost` favors a topic when choosing episodes.
  topics:
    - {name: "Hearables & on-device audio AI", boost: 1.6,
       keywords: [hearable, earable, earbud, hearing aid, target speech, speech separation, spatial audio, binaural, noise cancellation, audio language model, speech enhancement]}
    - {name: "Wireless & acoustic sensing", boost: 1.5,
       keywords: [wireless sensing, acoustic sensing, backscatter, battery-free, rf sensing, wifi sensing, mmwave, radar, ultrasound, sonar, wearable]}
    - {name: "On-device & efficient ML", boost: 1.3,
       keywords: [on-device, edge, quantization, distillation, pruning, low-power, efficient inference, small language model, lora, mobile]}
    - {name: "LLM reasoning & test-time compute",
       keywords: [reasoning, chain-of-thought, test-time, reinforcement learning, rlvr, verifier, math, thinking]}
    - {name: "AI agents & tool use",
       keywords: [agent, agentic, tool use, computer use, coding agent, swe-bench, mcp]}
    - {name: "Training & scaling",
       keywords: [scaling law, pretraining, data mixture, optimizer, mixture of experts, moe, long context, attention, transformer, normalization]}
    - {name: "LLM serving & ML infrastructure", boost: 1.2,
       keywords: [serving, inference serving, kv cache, speculative decoding, gpu, batching, ml platform, feature store, mlops, technical debt, throughput]}
    - {name: "Distributed systems & databases", boost: 1.2,
       keywords: [consensus, raft, paxos, replication, distributed database, transaction, consistency, storage, fault tolerance, key-value, sharding, postgres]}
    - {name: "Interpretability & safety",
       keywords: [interpretability, mechanistic, sparse autoencoder, alignment, safety, jailbreak, reward hacking]}
    - {name: "Recommendation & production ML",
       keywords: [recommendation, recommender, ranking, click-through, ads, retrieval, embedding, two-tower]}
    - {name: "Multimodal & vision-language",
       keywords: [multimodal, vision-language, vlm, video generation, image generation, world model]}
  listener_profile: >
    The listener is a UW CS senior about to start as a new-grad software engineer, who
    works in the Mobile Intelligence Lab (hearables, acoustic/wireless sensing, on-device AI)
    and is preparing for MLE and distributed-systems interviews.
  prompt: >
    Explain the problem and why earlier approaches fell short; the core ideas with concrete
    intuition (walk through a small example); the key design decisions and their tradeoffs; what
    the results actually show and their limitations; and how these ideas show up in real production
    systems today. End with 3 interview-style questions and crisp answers, plus one open question
    worth having an opinion on.

