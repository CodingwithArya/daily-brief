  - {name: Murat Demirbas (Metadata), kind: rss, section: swe, weight: 1.3, url: "https://muratbuffalo.blogspot.com/feeds/posts/default", cadence: weekly}
  - {name: Martin Kleppmann,       kind: rss, section: swe, weight: 1.4, url: "https://martin.kleppmann.com/feed.xml", cadence: weekly}
  - {name: Julia Evans,            kind: rss, section: swe, weight: 1.0, url: "https://jvns.ca/atom.xml", cadence: weekly}

